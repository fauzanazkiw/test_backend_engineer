services:
  postgres:
    image: postgres:15-alpine
    container_name: bioskop
    environment:
      POSTGRES_USER: bioskop
      POSTGRES_PASSWORD: bioskop123
      POSTGRES_DB: bioskop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bioskop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioskop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
